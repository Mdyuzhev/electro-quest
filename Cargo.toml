[package]
name = "electro-quest"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Красочная учебная игра по основам электротехники для 7–9 классов"
license = "MIT"
repository = "https://github.com/Mdyuzhev/electro-quest"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
serde = { version = "1", features = ["derive"] }
